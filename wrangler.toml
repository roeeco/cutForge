# Cloudflare Worker: static app + /api (class submissions, teacher view).
name = "cutforge"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# every request goes through the Worker so the site password (SITE_PASSWORD) covers the app files too
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cutforge"
database_id = "1ceab6b9-da94-4c3c-bc21-5dda79a0ae96"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "cutforge-submissions"

# Secrets (not in this file):
#   npx wrangler secret put TEACHER_KEY      # the teacher's sign-in key
#   npx wrangler secret put SESSION_SECRET   # long random string for signing sessions
#   npx wrangler secret put SITE_PASSWORD    # optional: one password for the whole site
